<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embroidery Machine · Fault Diagnosis</title>
    <style>
        /* ----- Global Styles ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
        }

        .preview-container {
            max-width: 1200px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.07), 0 8px 24px rgba(0, 0, 0, 0.04);
            padding: 2rem 2rem 2.2rem;
            transition: box-shadow 0.3s;
        }

        /* ----- Banner Area ----- */
        .banner-wrapper {
            display: flex;
            gap: 1.8rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .banner {
            flex: 1.2 1 460px;
            position: relative;
            height: 380px;
            border-radius: 18px;
            overflow: hidden;
            background: #d5dbe8;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            min-height: 260px;
        }

        .banner-image {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: opacity;
        }

        .banner-image.fade {
            opacity: 0;
        }
        .banner-image.show {
            opacity: 1;
        }

        .banner-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 2rem 2rem 1.5rem;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0.1) 70%, transparent 100%);
            pointer-events: none;
        }

        .banner-title {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            margin: 0;
            line-height: 1.2;
        }

        .banner-sub {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            font-weight: 400;
            margin-top: 0.2rem;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
        }

        /* ----- Info Panel ----- */
        .info-panel {
            flex: 0.9 1 340px;
            background: #f8faff;
            border-radius: 18px;
            padding: 1.6rem 1.8rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid #edf0f5;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
            min-height: 260px;
            transition: background 0.3s;
        }

        .info-panel .info-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #6c7a9a;
            margin-bottom: 0.25rem;
        }

        .info-panel .info-headline {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a1e2b;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-panel .info-headline .badge-id {
            background: #eef1f8;
            color: #2d3a5e;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
        }

        .info-panel .info-desc {
            font-size: 0.92rem;
            color: #2d3a5e;
            line-height: 1.6;
            margin-bottom: 0.8rem;
            padding-left: 2px;
        }

        .info-panel .info-solution {
            background: #eef4ff;
            border-left: 4px solid #4f6ef7;
            padding: 0.7rem 1rem 0.7rem 1.2rem;
            border-radius: 8px;
            font-size: 0.88rem;
            color: #1a2a4a;
            line-height: 1.5;
            margin-top: 0.2rem;
        }

        .info-panel .info-solution strong {
            color: #4f6ef7;
            font-weight: 600;
        }

        .info-panel .empty-state {
            color: #9aa7c0;
            font-size: 0.95rem;
            text-align: center;
            padding: 0.8rem 0;
        }

        /* ----- Tabs / Thumbnails ----- */
        .tabs-wrapper {
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0.4rem 0.2rem 0.6rem;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f1f3f6;
        }

        .tabs-wrapper::-webkit-scrollbar {
            height: 5px;
        }
        .tabs-wrapper::-webkit-scrollbar-track {
            background: #f1f3f6;
            border-radius: 10px;
        }
        .tabs-wrapper::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .tabs-list {
            display: flex;
            gap: 1rem;
            flex-wrap: nowrap;
            min-width: max-content;
            padding: 0.2rem 0.1rem;
        }

        /* ----- Single Tab ----- */
        .tab-item {
            flex: 0 0 160px;
            width: 160px;
            height: 110px;
            border-radius: 14px;
            background-size: cover;
            background-position: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1),
                box-shadow 0.3s ease,
                border-color 0.3s ease;
            border: 3px solid transparent;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            user-select: none;
            flex-shrink: 0;
        }

        .tab-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 55%;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.5) 0%, transparent 100%);
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .tab-label {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
            z-index: 2;
            padding: 0 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: transform 0.3s;
        }

        .tab-item:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
            z-index: 3;
        }

        .tab-item.active {
            border-color: #4f6ef7;
            transform: translateY(-6px) scale(1.05);
            box-shadow: 0 16px 40px rgba(79, 110, 247, 0.25), 0 4px 16px rgba(79, 110, 247, 0.10);
            z-index: 5;
        }

        .tab-item.active .tab-label {
            color: #ffffff;
            transform: scale(1.06);
            text-shadow: 0 2px 20px rgba(79, 110, 247, 0.5);
        }

        .tab-item.active::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 16px;
            background: linear-gradient(135deg, #4f6ef7, #7c5cfc);
            opacity: 0.2;
            z-index: -1;
            filter: blur(8px);
        }

        .tab-index {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 0.6rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.3);
            z-index: 3;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            padding: 2px 10px;
            border-radius: 20px;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tab-item.active .tab-index {
            color: rgba(255, 255, 255, 0.9);
            background: rgba(79, 110, 247, 0.4);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* ----- Responsive ----- */
        @media (max-width: 820px) {
            .banner-wrapper {
                flex-direction: column;
            }
            .banner {
                height: 300px;
                flex: unset;
                width: 100%;
            }
            .info-panel {
                flex: unset;
                width: 100%;
                min-height: 180px;
                padding: 1.2rem 1.4rem;
            }
            .preview-container {
                padding: 1.2rem 1rem 1.5rem;
            }
            .banner-title {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .banner {
                height: 200px;
                border-radius: 14px;
            }
            .banner-overlay {
                padding: 1rem 1.2rem 0.8rem;
            }
            .banner-title {
                font-size: 1.2rem;
            }
            .banner-sub {
                font-size: 0.7rem;
            }
            .info-panel {
                padding: 1rem 1rem;
                border-radius: 14px;
                min-height: 140px;
            }
            .info-panel .info-headline {
                font-size: 0.95rem;
            }
            .info-panel .info-desc {
                font-size: 0.82rem;
            }
            .info-panel .info-solution {
                font-size: 0.78rem;
                padding: 0.5rem 0.8rem;
            }
            .tab-item {
                flex: 0 0 110px;
                width: 110px;
                height: 80px;
                border-radius: 10px;
                border-width: 2px;
            }
            .tab-label {
                font-size: 0.6rem;
                bottom: 6px;
            }
            .tab-index {
                font-size: 0.5rem;
                top: 5px;
                right: 6px;
                padding: 1px 6px;
            }
            .tabs-list {
                gap: 0.6rem;
            }
            .tab-item.active {
                transform: translateY(-4px) scale(1.04);
            }
        }

        @media (max-width: 400px) {
            .tab-index {
                display: none;
            }
        }

        .banner-image.loading {
            background: linear-gradient(135deg, #e6e9f0 25%, #d5dbe8 50%, #e6e9f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
    </style>
</head>
<body>

    <div class="preview-container">
        <!-- ===== Banner + Info Panel ===== -->
        <div class="banner-wrapper">
            <!-- Banner Image -->
            <div class="banner" id="banner">
                <div class="banner-image" id="bannerImage" style="background-image: url('');"></div>
                <div class="banner-overlay">
                    <h2 class="banner-title" id="bannerTitle">Select a Fault</h2>
                    <p class="banner-sub" id="bannerSub">Click a thumbnail below to investigate</p>
                </div>
            </div>

            <!-- Info Panel -->
            <div class="info-panel" id="infoPanel">
                <div class="info-label">🔍 Fault Diagnosis</div>
                <div class="info-headline" id="infoHeadline">
                    <span id="infoName">Fault Name</span>
                    <span class="badge-id" id="infoBadge">#01</span>
                </div>
                <div class="info-desc" id="infoDesc">Observed symptoms description</div>
                <div class="info-solution" id="infoSolution">
                    <strong>🛠️ Root Cause & Fix</strong><br />
                    <span id="solutionText">Click a fault to see diagnosis</span>
                </div>
            </div>
        </div>

        <!-- ===== Thumbnail Tabs ===== -->
        <div class="tabs-wrapper">
            <div class="tabs-list" id="tabsList">
                <!-- JS renders dynamically -->
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            //  FAULT DATA — 图片直接放在 /Symptom Diagnosis/images/ 目录下
            //  注意：URL 中的空格需要编码为 %20
            // ================================================================
            const IMAGE_BASE = '/Symptom%20Diagnosis/images/';

            const FAULT_DATA = [{
                title: 'Ragged Thread Break',
                symptom: 'Thread breaks unevenly, leaving a rough or damaged end. The thread may break due to incorrect needle orientation.',
                rootCause: '1. Needle is installed in the wrong direction.\n2. Incorrect needle orientation causes the thread to rub against the needle and break unevenly.\n3. Needle is not fully inserted or securely tightened.',
                image: IMAGE_BASE + 'thread-break.jpg',
                thumb: IMAGE_BASE + 'thread-break-thumb.jpg'
            }, {
                title: 'Birdnesting',
                symptom: 'Thread tangles underneath the fabric. Loops form on the underside.',
                rootCause: '1. Bobbin case not inserted correctly.\n2. Top tension too loose.\n3. Bobbin thread not pulled through tension spring.\n4. Hook timing needs adjustment.',
                image: IMAGE_BASE + 'birdnesting.jpg',
                thumb: IMAGE_BASE + 'birdnesting-thumb.jpg'
            }, {
                title: 'Skipped Stitches',
                symptom: 'Stitches are missing or appear incomplete in certain areas of the design.',
                rootCause: '1. Stitch length is too long.\n2. Long stitches can fail to form properly, resulting in skipped stitches.',
                image: IMAGE_BASE + 'skipped-stitches.jpg',
                thumb: IMAGE_BASE + 'skipped-stitches.jpg'
            }, {
                title: 'Design Distortion',
                symptom: 'Embroidery design looks stretched, compressed, or misaligned.',
                rootCause: '1. Fabric not hooped tightly.\n2. Stabilizer insufficient or wrong type.\n3. Design digitized with incorrect density.\n4. Machine speed too high for the fabric.',
                image: IMAGE_BASE + 'design-distortion.jpg',
                thumb: IMAGE_BASE + 'design-distortion.jpg'
            }, {
                title: 'Pull Compensation Issue',
                symptom: 'The design does not maintain the intended shape or size. Edges may pull inward or gaps may appear between stitches.',
                rootCause: '1. Insufficient pull compensation.\n2. Fabric pulls inward during embroidery, causing gaps or distorted edges.\n3. Pull compensation is not properly adjusted for the fabric and stitch density.',
                image: IMAGE_BASE + 'Pull.jpg',
                thumb: IMAGE_BASE + 'Pull.jpg'
            }, {
                title: 'Bobbin Thread Showing on Top',
                symptom: 'Bobbin thread visible on the top side of the fabric.',
                rootCause: '1. Top tension too loose.\n2. Bobbin tension too tight.\n3. Thread not in the take-up lever.\n4. Machine not threaded correctly.',
                image: IMAGE_BASE + 'bobbin-top.jpg',
                thumb: IMAGE_BASE + 'bobbin-top.jpg'
            }, {
                title: 'Thread Trimming Failure',
                symptom: 'Thread not cut after color change or design end. Long tail remains.',
                rootCause: '1. Thread scraps, dust, or leftover thread in the Bobbin Case may affect thread trimming.\n2. Incorrect or insufficient upper and lower thread tension can prevent the thread from being cut properly.\n3. Upper thread is not following the correct path through the Thread Cutter or is caught or out of position.\n4. Thread Cutter blades may be worn or dull.\n5. Incorrect machine settings may affect thread trimming.',
                image: IMAGE_BASE + 'trimming-failure.jpg',
                thumb: IMAGE_BASE + 'trimming-failure.jpg'
            }, {
                title: 'Hopping / Jumping',
                symptom: 'Needle hits the hoop or fabric jumps during embroidery.',
                rootCause: '1. The gap between the fabric and the needle plate is too high.\n2. Fabric is not hooped evenly or securely.\n3. Too many layers of fabric or stabilizer increase the height of the material.\n4. Machine speed is too high.\n5. Hoop is not tightened securely.',
                image: IMAGE_BASE + 'hopping.jpg',
                thumb: IMAGE_BASE + 'hopping.jpg'
            }, {
                title: 'Needle Break',
                symptom: 'Needle snaps during operation. May damage the fabric or rotary hook.',
                rootCause: '1. Needle is bent, damaged, or the wrong size.\n2. Needle hits the presser foot, hoop, or another metal part.\n3. When embroidering hats, the hat is not properly fitted against the needle plate.\n4. Design is too dense, causing excessive needle penetration force.\n5. Rotary hook timing is incorrect. The hook position at 202° is not properly aligned.',
                image: IMAGE_BASE + 'needle-break.jpg',
                thumb: IMAGE_BASE + 'needle-break.jpg'
            }, {
                title: 'Embroidery Too Close to Hat Brim',
                symptom: 'The embroidery design is positioned too close to the hat brim. The brim may hit the machine or presser foot, causing the embroidery to become distorted or incomplete near the brim.',
                rootCause: '1. The design is positioned too close to the hat brim.\n2. The hat brim interferes with the machine during embroidery.\n3. The hat is not properly positioned or fitted on the hat driver.\n4. The embroidery area near the brim does not have enough clearance for the machine to stitch properly.',
                image: IMAGE_BASE + 'Embroidery.jpg',
                thumb: IMAGE_BASE + 'Embroidery.jpg'
            }];

            // ---------- DOM refs ----------
            const tabsList = document.getElementById('tabsList');
            const bannerImage = document.getElementById('bannerImage');
            const bannerTitle = document.getElementById('bannerTitle');
            const bannerSub = document.getElementById('bannerSub');

            const infoName = document.getElementById('infoName');
            const infoBadge = document.getElementById('infoBadge');
            const infoDesc = document.getElementById('infoDesc');
            const solutionText = document.getElementById('solutionText');

            // ---------- State ----------
            let currentIndex = 0;
            const total = FAULT_DATA.length;
            let isTransitioning = false;

            // ---------- Render Tabs ----------
            function renderTabs() {
                let html = '';
                FAULT_DATA.forEach((item, index) => {
                    const activeClass = index === 0 ? 'active' : '';
                    html += `
                        <div class="tab-item ${activeClass}" 
                             data-index="${index}" 
                             style="background-image: url('${item.thumb}');"
                             role="button" 
                             tabindex="0"
                             aria-label="Diagnose: ${item.title}">
                            <span class="tab-index">${String(index + 1).padStart(2, '0')}</span>
                            <span class="tab-label">${item.title}</span>
                        </div>
                    `;
                });
                tabsList.innerHTML = html;

                const items = tabsList.querySelectorAll('.tab-item');
                items.forEach((item) => {
                    item.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index, 10);
                        if (idx !== currentIndex) setActiveTab(idx);
                    });
                    item.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            const idx = parseInt(this.dataset.index, 10);
                            if (idx !== currentIndex) setActiveTab(idx);
                        }
                    });
                });
            }

            // ---------- Set Active Tab ----------
            function setActiveTab(index) {
                if (isTransitioning || index === currentIndex) return;
                if (index < 0 || index >= total) return;

                isTransitioning = true;

                const items = tabsList.querySelectorAll('.tab-item');
                items.forEach((item, i) => {
                    item.classList.toggle('active', i === index);
                });

                currentIndex = index;

                updateBanner(index, () => {
                    isTransitioning = false;
                });

                updateInfoPanel(index);

                const activeItem = items[index];
                if (activeItem) {
                    const wrapper = tabsList.parentElement;
                    const itemLeft = activeItem.offsetLeft;
                    const itemWidth = activeItem.offsetWidth;
                    const wrapperWidth = wrapper.clientWidth;
                    const scrollLeft = wrapper.scrollLeft;
                    if (itemLeft < scrollLeft || itemLeft + itemWidth > scrollLeft + wrapperWidth) {
                        wrapper.scrollTo({
                            left: itemLeft - (wrapperWidth - itemWidth) / 2,
                            behavior: 'smooth'
                        });
                    }
                }
            }

            // ---------- Update Banner ----------
            function updateBanner(index, callback) {
                const item = FAULT_DATA[index];
                const url = item.image;

                bannerImage.classList.remove('show');
                bannerImage.classList.add('fade');

                bannerTitle.textContent = item.title;
                bannerSub.textContent = `Fault ${index + 1} of ${total} · Click thumbnail to switch`;

                const imgLoader = new Image();
                imgLoader.onload = () => {
                    bannerImage.style.backgroundImage = `url('${url}')`;
                    bannerImage.classList.remove('fade');
                    bannerImage.classList.add('show');
                    if (callback) callback();
                };
                imgLoader.onerror = () => {
                    bannerImage.style.backgroundImage = `linear-gradient(135deg, #4f6ef7, #7c5cfc)`;
                    bannerImage.classList.remove('fade');
                    bannerImage.classList.add('show');
                    if (callback) callback();
                };
                imgLoader.src = url;

                setTimeout(() => {
                    if (bannerImage.classList.contains('fade')) {
                        bannerImage.style.backgroundImage = `url('${url}')`;
                        bannerImage.classList.remove('fade');
                        bannerImage.classList.add('show');
                        if (callback) callback();
                    }
                }, 5000);
            }

            // ---------- Update Info Panel ----------
            function updateInfoPanel(index) {
                const item = FAULT_DATA[index];
                infoName.textContent = item.title;
                infoBadge.textContent = `#${String(index + 1).padStart(2, '0')}`;
                infoDesc.textContent = item.symptom;
                const solutionHtml = item.rootCause.replace(/\n/g, '<br />');
                solutionText.innerHTML = solutionHtml;
            }

            // ---------- Init ----------
            function init() {
                renderTabs();

                const first = FAULT_DATA[0];
                bannerImage.style.backgroundImage = `url('${first.image}')`;
                bannerImage.classList.add('show');
                bannerTitle.textContent = first.title;
                bannerSub.textContent = `Fault 1 of ${total} · Click thumbnail to switch`;

                updateInfoPanel(0);

                const firstTab = tabsList.querySelector('.tab-item');
                if (firstTab) firstTab.classList.add('active');

                window.setActiveTab = setActiveTab;
                console.log(`✅ Embroidery Fault Diagnosis loaded — ${total} faults available`);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
